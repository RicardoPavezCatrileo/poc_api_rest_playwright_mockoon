name: API Tests

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MOCKOON_CLI_VERSION: "9.10.0"

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obtener el código
        uses: actions/checkout@v7

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Validar el archivo de Mockoon
        run: npx --yes "@mockoon/cli@${MOCKOON_CLI_VERSION}" validate --data mocks/usuarios-api.json

      - name: Iniciar Mockoon CLI
        run: |
          nohup npx --yes "@mockoon/cli@${MOCKOON_CLI_VERSION}" start \
            --data mocks/usuarios-api.json --disable-log-to-file --log-transaction > mockoon.log 2>&1 &

      - name: Esperar a que la API esté disponible
        run: |
          curl --fail --silent --show-error --output /dev/null \
            --retry 60 --retry-delay 1 --retry-all-errors \
            http://localhost:3001/api/health

      - name: Ejecutar las pruebas
        run: >
          python -m pytest -v
          --html=reports/report.html --self-contained-html
          --cov=clients --cov=config --cov=utils --cov-report=term

      - name: Publicar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reporte-pruebas
          path: |
            reports/report.html
            mockoon.log
          if-no-files-found: warn
